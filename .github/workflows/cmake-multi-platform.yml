name: CMake on multiple platforms
on:
  pull_request:
  push:
    branches:
      - main
      - master
jobs:
  test:
    env:
      BUILD_TYPE: RelWithDebInfo
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            compiler:
              name: gcc
              c: gcc-15
              cpp: g++-15
          - os: ubuntu-26.04
            compiler:
              name: llvm
              c: clang
              cpp: clang++
          - os: macos-26
            compiler:
              name: gcc
              c: gcc-15
              cpp: g++-15
          - os: macos-26
            compiler:
              name: llvm
              c: clang
              cpp: clang++
          - os: windows-2025
            compiler:
              name: msvc
              c: cl
              cpp: cl

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/vcpkg
            ~/.cache/vcpkg/archives
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
            ${{ env.APPDATA }}/vcpkg/archives
            ${{ env.XDG_CACHE_HOME }}/vcpkg/archives
            ~/.cache/ccache
            ~/.ccache
            ~/.config/ccache
            ~/Library/Caches/ccache
            ${{ env.LOCALAPPDATA }}/ccache
            ${{ env.XDG_CACHE_HOME }}/ccache
          key: |
            ${{ runner.os }}-${{ matrix.compiler.name }}-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', './vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler.name }}-${{ env.BUILD_TYPE }} -

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler.name }}
          cmake: true
          ninja: true
          clang-tidy: true
          clang-format: true
          ccache: true

      - name: Set up Clang
        if: ${{ matrix.compiler.name == 'llvm' && runner.os != 'macOS' }}
        uses: egor-tensin/setup-clang@v2
        with:
          version: 22
          platform: x64

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install Bison and Flex
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get install -y bison flex
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install bison flex
              # shellcheck disable=SC2016
              echo 'export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"' \
                  >> /Users/runner/.bash_profile
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
              winget install --id=WinFlexBison.win_flex_bison \
                  -e --accept-source-agreements --accept-package-agreements
          fi

      - name: Configure via Just
        run: |
          cmake -B build -G Ninja \
              "-DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }}" \
              "-DCMAKE_C_COMPILER=${{ matrix.compiler.c }}" \
              "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" \
              "-DSANITIZERS=ON"

      - name: Build via Just
        run: just build

      - name: Test via Just
        run: just test
